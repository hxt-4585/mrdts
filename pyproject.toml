[project]
name = "mrdts"
version = "0.1.0"
description = "Multi-Region Distributed Task Scheduling simulation environment"
requires-python = ">=3.11,<3.12"
dependencies = [
    "matplotlib>=3.8",
    "networkx>=3.2",
    "numpy>=1.26",
    "torch>=2.10,<2.11",
]

# Keep Windows/Linux on the CUDA build instead of the Windows CPU default.
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu126", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]
