[geometry]
# 全局正方形仿真区域的边长，单位：m。
side_length = 1000.0
# 每条边切分的基础网格数；区域地图形状为 grid_size × grid_size。
grid_size = 100

[partition]
# 逻辑子区域数量。
region_count = 4
# 单个子区域占全部网格的最小比例，用于避免区域面积过小。
min_area_ratio = 0.1
# 子区域面积差异强度；0 表示尽量均衡，越接近 1 面积差异越明显。
area_imbalance = 0.8
# Lloyd 迭代次数；越大，区域越接近紧凑的质心 Voronoi 分区。
lloyd_iterations = 20
# 每次 Lloyd 迭代中调整种子权重以逼近目标面积的最大次数。
capacity_iterations = 80
# 区域生成器的独立随机种子；相同配置与种子生成相同区域地图。
seed = 41
