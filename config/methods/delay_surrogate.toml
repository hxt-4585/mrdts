# 独立纯时延基线：python -m methods.delay_surrogate.run
# 留出评估：python -m methods.delay_surrogate.evaluate --checkpoint RUN/checkpoint.pt
# 与 local_surrogate 使用同一低层、环境、seed、候选、协商及探索配置。
# 代理模型只预测 D_region/H，评分为预计时延 + 时延预测不确定性惩罚。
# 不训练能耗输出、不使用 Q 加权；环境能耗与队列只作为诊断记录。
[train]
member_checkpoint = "results/random_uav_ppo/seed_45/train_20261103T162321_743467Z_84a29361/checkpoint.pt"
episodes = 30
seed = 45
device = "cpu"
torch_threads = 1
warmup_slots = 128
exploration = 0.15
candidates = 32
rounds = 2
features = 32
ridge = 1.0
uncertainty_penalty = 0.05
log_interval = 50
output_root = "results"
