[topology]
# 每个 DAG 包含的子任务节点数。
n = 10
# 每个节点允许的最大后继节点数。
max_out = 2
# DAG 稠密度参数，影响分层数量与图深度。
rho = 1.0
# DAG 拓扑随机性参数，影响各层节点数量的波动。
delta = 0.5

[features]
# 每个子任务原始输入数据量范围，单位：KB，闭区间。
input_data_range = [100, 500]
# 每个子任务计算量范围，单位：CPU cycles。
cpu_range = [10000000.0, 100000000.0]
# DAG 依赖边的中间结果数据量范围，单位：KB，闭区间。
intermediate_data_range = [100, 300]
