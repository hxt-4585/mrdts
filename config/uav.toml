[master]
# Master UAV 总数；必须与区域数量一致，保证每个区域恰有一架 Master。
uav_count = 4
# Master UAV 的固定飞行高度（m）。
altitude = 50.0

[member]
# 全部 Member UAV 的总数；初始时按各区域地面用户数分配。
uav_count = 12
# 每个区域初始至少部署的 Member UAV 数量。
min_uavs_per_region = 1
# Member UAV 的初始飞行高度（m）。
altitude = 50.0
# 每架 Member UAV 在单个时隙内分配的能量（J）。
slot_energy = 145.0
# 时隙中飞行阶段的持续时间（s）。
flight_duration = 0.5
# Member UAV 的最大水平飞行速度（m/s）。
max_horizontal_speed = 10.0
# 每架 Member UAV 的计算核心数。
core_count = 2
# 每个 Member 计算核心的频率（CPU cycles/s）。
core_frequency = 10000000000.0

[bs]
# 全局固定 BS 的天线高度（m）。水平坐标由环境几何中心确定。
altitude = 25.0
# BS 的计算核心数。
core_count = 4
# 每个 BS 计算核心的频率（CPU cycles/s）。
core_frequency = 12000000000.0
