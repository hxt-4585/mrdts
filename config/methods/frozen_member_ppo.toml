# 独立高层基线：仅训练 Master，Member 使用第 371 轮预训练权重并冻结。
# 训练：python methods/frozen_member_ppo/run.py
# 评估：python methods/frozen_member_ppo/evaluate.py --checkpoint RUN/checkpoint.pt
# 环境和网络宽度来自低层 checkpoint；修改公共环境配置不会影响本基线。
# --slots 可缩短冒烟测试；正式训练沿用低层的 500 slots/episode。
[train]
member_checkpoint = "results/random_uav_ppo/seed_45/train_20261103T162321_743467Z_84a29361/checkpoint.pt"
episodes = 500
seed = 45
device = "cpu"
torch_threads = 1
# 4 个 Master × 64 时隙 = 256 样本；episode 末尾保留剩余样本。
rollout_slots = 64
ppo_epochs = 4
minibatch_size = 256
learning_rate = 0.0003
master_gamma = 0.99
gae_lambda = 0.95
clip_ratio = 0.2
entropy_coef = 0.01
value_coef = 0.5
max_grad_norm = 0.5
# 与 HMAPPO 一致，每个越界 UAV 惩罚其飞行前所属 Master。
boundary_penalty = 1.0
output_root = "results"
# episodes.csv 每个 episode 一行；控制台打印全体 Master 训练奖励总和及平均 DAG 时延。
# initial.pt 保存初始高层及冻结低层；checkpoint.pt 每轮原子覆盖。
# snapshot.pt 首轮及每 10 轮覆盖。各检查点包含低层参数，可独立评估。
snapshot_interval = 10
