[bandwidth]
# 全网共享的总带宽（MHz），所有活动有向信道连续均分。
# 理想正交、无内部同频干扰；忽略外部干扰、重分配开销和收发自干扰。
# 设备可在不同频带同时收发，不显式建模子载波。
total_mhz = 12.0

[propagation]
# 1 m 处的参考信道增益；当前简化模型使用 gain = g0 / d^2。
reference_channel_gain = 1e-6
# NLoS 相对 LoS 的增益衰减系数，必须位于 (0, 1]。
nlos_attenuation_factor = 0.2
# 接收机等效噪声功率谱密度（W/Hz），噪声功率 = 谱密度 × 分配带宽。
# 默认值由原来的 1e-13 W 在参考带宽 4 MHz 下换算，非每链路固定噪声。
noise_density_w_per_hz = 2.5e-20

[propagation.los_probability]
# 仰角 LoS 概率模型：1 / (1 + alpha * exp(-beta * (theta - alpha)))。
alpha = 9.61
beta = 0.16
