# 分层 PPO：Master 共享 actor 与集中式 critic；每架 Member 独立 actor 与局部 critic。
# 复用公共环境配置；slots/users/dag_nodes 可用 CLI 覆盖，仅影响本次运行。
# 保留 ERS 子任务顺序。Master 学习飞行，Member 学习执行位置。
[train]
episodes = 500
seed = 45
device = "cpu"
torch_threads = 1
hidden = 128
rollout_slots = 8
ppo_epochs = 4
minibatch_size = 256
learning_rate = 0.0003
master_gamma = 0.99
# 每架受控 Member 越界时，负责该飞行动作的 Master 扣除的奖励。
boundary_penalty = 1
# 低层以时隙为 episode；按自身决策序列累计奖励，不按物理时间折扣。
member_gamma = 1.0
gae_lambda = 0.95
clip_ratio = 0.2
entropy_coef = 0.01
value_coef = 0.5
max_grad_norm = 0.5
output_root = "results"
# 低层详细诊断的更新间隔；高层每次记录，低层在 episode 结束时也记录。
diagnostics_interval = 5
# 控制台摘要的更新间隔；每个 episode 结束仍输出。CSV 每次更新刷新。
log_interval = 5
