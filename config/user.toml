[population]
# 全局地面用户总数。
total_users = 50
# 每个区域至少分配的用户数量。
min_users_per_region = 1
# 按区域面积分配用户时施加的相对浮动上限，例如 0.1 表示 ±10%。
area_fluctuation = 0.1
# 区域内用户向质心聚集的强度；0 表示均匀分布，1 表示纯中心分布。
center_bias = 0.85
# 中心分布的扩散范围，相对于区域等效半径；值越大，分布越平缓。
center_spread_ratio = 0.25
# 每台地面用户的总发射功率预算（W），其活动发送信道均分。
transmit_power = 0.3

[computation]
# 每台地面设备的计算核心数。
core_count = 2
# 每个地面设备计算核心的频率（CPU cycles/s）。
core_frequency = 1000000000.0
